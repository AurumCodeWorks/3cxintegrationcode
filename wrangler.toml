name = "3cx-salesforce-proxy-cedarcare"
main = "src/index.js"
compatibility_date = "2024-03-01"

# One Worker per Salesforce org. The credentials, login URL and org model live
# here rather than in the 3CX template, so a second org would need a second
# Worker — but a PBX can only run one CRM integration at a time, so that is
# only useful with a second PBX.
#
# There used to be a second Worker for an older test org. It was deleted on
# 2026-09-08: two near-identical URLs caused a live misconfiguration, and
# pointing at the wrong one fails silently by writing calls into the wrong org.

# Everything not listed under [vars] stays dashboard-managed so it can be
# changed without a deploy. keep_vars stops a deploy wiping those values. It
# must sit above [vars]: below it, TOML reads it as a variable named keep_vars
# and every deploy wipes the dashboard values.
#   - SALESFORCE_EXTRA_FIELDS      (JSON per object type, e.g. Lead Source once the picklist has the value)
#   - SALESFORCE_HOME_VALUES       (JSON, 3CX department name to Care_Home__c value where they differ)
#   - SALESFORCE_FALLBACK_OWNER    (user or Task queue for call logs 3CX finds no user for)
#   - HOME_COUNTRY                 (default GB)
#   - MIN_SEARCH_LENGTH            (default 3)
#   - CALL_MERGE_WINDOW_MINUTES    (default 5, 0 disables)
#   - THREECX_CLIENT_ID            (secret, 3CX API client)
#   - THREECX_CLIENT_SECRET        (secret, 3CX API client)
#   - EXTENSION_DEPARTMENTS        (fallback home-name map when the 3CX API is not set)
#   - ALERT_WEBHOOK_URL            (secret, optional failure alerts)
#   - PROXY_API_KEY                (secret)
#   - SALESFORCE_CLIENT_ID         (secret)
#   - SALESFORCE_CLIENT_SECRET     (secret)
keep_vars = true

# Moving to Cedar Care's PRODUCTION org is a config change, not a deployment:
# set SALESFORCE_LOGIN_URL below to https://cedarcarehomes.my.salesforce.com
# (the My Domain URL: login.salesforce.com is refused) and re-set the two
# External Client App secrets.
# Each "secret put" goes live on its own, so set both in one go to avoid a
# window where the URL and credentials belong to different orgs:
#   npx wrangler secret bulk secrets.json   (then delete secrets.json)
# Then check the dashboard values that name things in one org:
# SALESFORCE_FALLBACK_OWNER (a UAT user or queue will not exist in production)
# and SALESFORCE_HOME_VALUES (production's Care_Home__c values).
# The 3CX template, the Worker URL and the Proxy API Key all stay as they are.

# These define which org this Worker talks to, so they live in code where they
# are reviewable. Editing them in the dashboard is reverted by the next deploy.
[vars]
SALESFORCE_LOGIN_URL = "https://cedarcarehomes--uat.sandbox.my.salesforce.com"
# Lead-first: an unknown caller answered through a tracked queue becomes a
# Lead, and once someone converts it, later calls match the Person Account.
SALESFORCE_ORG_MODEL = "lead"
# Unique External ID on Account, Contact and Lead, backfilled across every
# Person Account. Makes duplicates impossible at database level, and gives
# Cedar Care's duplicate rule a number to match on rather than a name.
SALESFORCE_EXTERNAL_ID_FIELD = "Phone_E164__c"
# A new enquiry's Lead carries its home here, from the 3CX department of the
# queue it came through, so Cedar Care's Lead assignment rule can route it.
# A value the field refuses costs the field, not the Lead.
SALESFORCE_HOME_FIELD = "Care_Home__c"
# The PBX whose departments name the homes. Its API client id and secret are
# the THREECX_CLIENT_ID and THREECX_CLIENT_SECRET secrets.
THREECX_URL = "https://cedarcare.my3cx.uk"
