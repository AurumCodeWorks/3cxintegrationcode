name = "3cx-salesforce-proxy"
main = "src/index.js"
compatibility_date = "2024-03-01"

# All configuration is managed in the Cloudflare dashboard so it can be
# edited without redeploying (Workers & Pages -> 3cx-salesforce-proxy ->
# Settings -> Variables and Secrets):
#   - SALESFORCE_LOGIN_URL       (plaintext variable)
#   - SALESFORCE_ORG_MODEL       (plaintext variable: contact|personaccount|lead)
#   - SALESFORCE_EXTRA_FIELDS    (plaintext variable: JSON per object type)
#   - HOME_COUNTRY               (plaintext variable, default GB)
#   - MIN_SEARCH_LENGTH          (plaintext variable, default 3)
#   - CALL_MERGE_WINDOW_MINUTES  (plaintext variable, default 5, 0 disables)
#   - SALESFORCE_EXTERNAL_ID_FIELD (plaintext variable, e.g. Phone_E164__c)
#   - ALERT_WEBHOOK_URL          (plaintext variable, optional failure alerts)
#   - PROXY_API_KEY              (secret)
#   - SALESFORCE_CLIENT_ID       (secret)
#   - SALESFORCE_CLIENT_SECRET   (secret)
# keep_vars prevents `wrangler deploy` from wiping dashboard-managed values.
keep_vars = true

# A second Salesforce org needs its own Worker, because the credentials,
# login URL and org model all live on the Worker rather than in the 3CX
# template. Deploy this one with:
#
#   npx wrangler deploy --env cedarcare
#
# It publishes as a separate Worker (3cx-salesforce-proxy-cedarcare) on its
# own URL, with its own variables and secrets set in the dashboard. The
# default Worker above is untouched, so the existing PBX keeps working.
#
# Set secrets against it explicitly:
#   npx wrangler secret put PROXY_API_KEY --env cedarcare
#
# keep_vars above is top-level and inherited, so it protects this env too.
[env.cedarcare]

# Which org this environment talks to is part of what defines it, so these
# two live in code rather than the dashboard. Everything else, including all
# three secrets and any tunables, is still dashboard-managed.
#
# Editing these in the dashboard will be reverted by the next deploy of this
# env. Change them here instead.
[env.cedarcare.vars]
SALESFORCE_LOGIN_URL = "https://cedarcarehomes--uat.sandbox.my.salesforce.com"
SALESFORCE_ORG_MODEL = "personaccount"
